plugins { id 'com.android.application' }

android {
    namespace 'ca.skymapontario.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ca.skymapontario.app'
        minSdk 24
        targetSdk 35
        versionCode 15000
        versionName '15.0.0'
    }

    sourceSets {
        main.assets.srcDirs = ['../../app']
    }

    signingConfigs {
        release {
            // Deliberately public continuity key. This enables zero-setup in-place APK
            // updates, but it is not a secure publisher identity because the private
            // key and credentials are committed to the public repository.
            storeFile file('signing/skymap-public-release.jks')
            storePassword 'skymap-public-release'
            keyAlias 'skymap-public'
            keyPassword 'skymap-public-release'
            storeType 'JKS'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.work:work-runtime:2.11.2'
}
