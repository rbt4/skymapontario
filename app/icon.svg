<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">SkyMap Ontario</title>
  <desc id="desc">A precise location pin inside live radar rings with an approaching rain front</desc>
  <defs>
    <radialGradient id="bg" cx="68%" cy="18%" r="95%">
      <stop stop-color="#17496c"/>
      <stop offset=".42" stop-color="#071b2d"/>
      <stop offset="1" stop-color="#020810"/>
    </radialGradient>
    <linearGradient id="pin" x1=".15" y1=".05" x2=".85" y2="1">
      <stop stop-color="#72e4ff"/>
      <stop offset=".56" stop-color="#4be9bf"/>
      <stop offset="1" stop-color="#d8ff78"/>
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#117cff"/>
      <stop offset=".55" stop-color="#00d990"/>
      <stop offset="1" stop-color="#d8ff78"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect x="6" y="6" width="148" height="148" rx="39"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect x="6" y="6" width="148" height="148" rx="39" fill="url(#bg)"/>
    <path d="M8 119 8 92c19-8 31-7 43 1 15 10 29 9 43-2 20-15 38-13 58 3v58H8Z" fill="#031220" opacity=".72"/>
    <path d="m-4 132 12-33 14 4 12-18 14 5 10-14 17 5-22 57Z" fill="url(#rain)" opacity=".72"/>
    <g fill="none" stroke="#72e4ff" stroke-linecap="round" opacity=".9">
      <circle cx="82" cy="82" r="55" stroke-width="3" opacity=".54"/>
      <circle cx="82" cy="82" r="40" stroke-width="2.5" opacity=".66"/>
      <circle cx="82" cy="82" r="26" stroke-width="2" opacity=".76"/>
      <path d="M82 20v124M20 82h124" stroke-width="1.5" opacity=".43"/>
      <path d="M82 82 139 55" stroke="#d8ff78" stroke-width="7" opacity=".2"/>
      <path d="M82 82 139 55" stroke="#d8ff78" stroke-width="2"/>
    </g>
    <path d="M82 48c-18 0-31 13-31 30 0 23 31 51 31 51s31-28 31-51c0-17-13-30-31-30Z" fill="url(#pin)" filter="url(#glow)"/>
    <circle cx="82" cy="78" r="14" fill="#04131e" stroke="#eaffff" stroke-width="4"/>
    <circle cx="82" cy="78" r="5" fill="#d8ff78"/>
    <path d="M101 29c8-10 20-11 29-4 9 6 12 17 8 27-7-7-15-9-24-7-3-7-7-12-13-16Z" fill="#dcefff" opacity=".9"/>
    <path d="M112 35c9-6 21-2 25 8-8-3-16-2-23 3Z" fill="#fff" opacity=".75"/>
    <g stroke="#72e4ff" stroke-width="2.5" stroke-linecap="round" opacity=".82"><path d="m122 105-5 9"/><path d="m136 101-5 9"/><path d="m148 97-5 9"/></g>
  </g>
  <rect x="6" y="6" width="148" height="148" rx="39" fill="none" stroke="#a7ecff" stroke-opacity=".18" stroke-width="2"/>
</svg>
