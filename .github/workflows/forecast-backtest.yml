name: SkyMap forecast verification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/forecast-backtest-v2.mjs'
      - 'scripts/forecast-weathernext-verifier.mjs'
      - '.github/workflows/forecast-backtest.yml'
      - 'verification/README.md'
  pull_request:
    paths:
      - 'scripts/forecast-backtest-v2.mjs'
      - 'scripts/forecast-weathernext-verifier.mjs'
      - '.github/workflows/forecast-backtest.yml'
      - 'verification/README.md'

permissions:
  contents: write

concurrency:
  group: forecast-verification
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate null-safe prospective verifiers
        run: |
          node --check scripts/forecast-backtest-v2.mjs
          node --check scripts/forecast-weathernext-verifier.mjs
          node scripts/forecast-backtest-v2.mjs --self-test
          node scripts/forecast-weathernext-verifier.mjs --self-test

  collect:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore bounded verification state
        run: |
          mkdir -p verification-data
          git fetch origin forecast-data || true
          git show origin/forecast-data:verification-data/state.json > verification-data/state.json 2>/dev/null || true
          git show origin/forecast-data:verification-data/weather-next-state.json > verification-data/weather-next-state.json 2>/dev/null || true
      - name: Collect and score conventional and official forecasts
        run: node scripts/forecast-backtest-v2.mjs
      - name: Collect and score WeatherNext ensemble prospectively
        run: node scripts/forecast-weathernext-verifier.mjs
      - name: Publish one-commit data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/skymap-verification
          cp verification-data/state.json verification-data/public.json verification-data/report.md verification-data/weather-next-state.json verification-data/weather-next-public.json verification-data/weather-next-report.md /tmp/skymap-verification/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan forecast-data-next
          git rm -rf .
          mkdir -p verification-data
          cp /tmp/skymap-verification/* verification-data/
          cat > README.md <<'EOF'
          # SkyMap Forecast Verification Data

          Machine-generated null-safe prospective verification for conventional, official, ensemble and WeatherNext 2 guidance in Ontario. Missing numeric forecast or observation fields are excluded rather than interpreted as dry weather. WeatherNext is scored independently before any larger production role is considered. This branch is force-replaced each run so history remains bounded.
          EOF
          git add README.md verification-data
          git commit -m "Update null-safe forecast verification $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push --force origin HEAD:forecast-data
