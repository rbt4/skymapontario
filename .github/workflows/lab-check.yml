name: Validate SkyMap Future Lab

on:
  pull_request:
    paths:
      - 'app/lab/**'
      - 'scripts/check-weathernext.mjs'
      - 'scripts/check-forecast-contract.mjs'
      - '.github/workflows/lab-check.yml'
  push:
    branches: [main]
    paths:
      - 'app/lab/**'
      - 'scripts/check-weathernext.mjs'
      - 'scripts/check-forecast-contract.mjs'
      - '.github/workflows/lab-check.yml'

permissions:
  contents: read

jobs:
  validate-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check Future Lab JavaScript and data hierarchy
        run: |
          node --check app/lab/accuracy-engine.js
          node --check app/lab/forecast-intelligence-25.js
          node --check app/lab/lab.js
          node --check scripts/check-weathernext.mjs
          node --check scripts/check-forecast-contract.mjs
          node scripts/check-forecast-contract.mjs
          grep -q '<script src="accuracy-engine.js"></script>' app/lab/index.html
          grep -q 'forecast-intelligence-25.js' app/lab/index.html
          grep -q 'ensemble-api.open-meteo.com' app/lab/index.html
          grep -q 'https://api.weather.gc.ca' app/lab/index.html
          grep -q "VERSION = '32.0.0'" app/lab/accuracy-engine.js
          grep -q "VERSION = '25.0.0'" app/lab/forecast-intelligence-25.js
          grep -q 'google_weathernext2_ensemble' app/lab/forecast-intelligence-25.js
          grep -q '__skymap_missing__' app/lab/forecast-intelligence-25.js
          grep -q 'x-skymap-null-guard' app/lab/forecast-intelligence-25.js
          grep -q 'Radar_1km_RainPrecipRate-Extrapolation' app/lab/accuracy-engine.js
          grep -q 'REPS.DIAG.3_PRMM.ERGE1' app/lab/accuracy-engine.js
          grep -q 'citypageweather-realtime' app/lab/accuracy-engine.js
          grep -q 'neighbourhoodCoordinates' app/lab/accuracy-engine.js
          grep -q 'leadBucket' app/lab/accuracy-engine.js
          grep -q 'row.snow' app/lab/accuracy-engine.js
          grep -q 'truth_contract' app/lab/accuracy-engine.js
          grep -q 'hasExplicitForecastEvidence' app/lab/accuracy-engine.js
      - name: Live Google WeatherNext 2 ensemble smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/check-weathernext.mjs
