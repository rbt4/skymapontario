name: Build and deploy SkyMap Ontario

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skymap-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Align and validate the readable release source
        run: |
          node scripts/prepare-release.mjs
          node --check assets/site.js
          node --check app/app.js
          node scripts/validate-release.mjs
          grep -q "android.useAndroidX=true" gradle.properties

      - name: Verify every live source used by the product
        run: node scripts/check-live-sources.mjs

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare disposable pull-request signing key
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/skymap-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          keytool -genkeypair -noprompt \
            -keystore "$SIGNING_DIR/pull-request.jks" \
            -storetype JKS \
            -storepass skymap-ci-only \
            -alias skymap-ci \
            -keypass skymap-ci-only \
            -keyalg RSA \
            -keysize 3072 \
            -validity 2 \
            -dname "CN=SkyMap Ontario Pull Request,O=RBT4,C=CA"
          cat > "$SIGNING_DIR/signing.properties" <<PROPS
          storeFile=$SIGNING_DIR/pull-request.jks
          storePassword=skymap-ci-only
          keyAlias=skymap-ci
          keyPassword=skymap-ci-only
          storeType=JKS
          PROPS
          chmod 600 "$SIGNING_DIR/pull-request.jks" "$SIGNING_DIR/signing.properties"
          echo "SKYMAP_SIGNING_PROPERTIES=$SIGNING_DIR/signing.properties" >> "$GITHUB_ENV"
          echo "SKYMAP_SIGNING_MODE=pull-request" >> "$GITHUB_ENV"

      - name: Prepare production signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SKYMAP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SKYMAP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKYMAP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SKYMAP_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.SKYMAP_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing SKYMAP_KEYSTORE_B64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Missing SKYMAP_KEYSTORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing SKYMAP_KEY_ALIAS repository secret}"
          : "${KEY_PASSWORD:?Missing SKYMAP_KEY_PASSWORD repository secret}"
          : "${EXPECTED_CERT_SHA256:?Missing SKYMAP_SIGNING_CERT_SHA256 repository secret}"

          SIGNING_DIR="$RUNNER_TEMP/skymap-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_DIR/release.jks"
          chmod 600 "$SIGNING_DIR/release.jks"
          keytool -list -keystore "$SIGNING_DIR/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          cat > "$SIGNING_DIR/signing.properties" <<PROPS
          storeFile=$SIGNING_DIR/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeType=JKS
          PROPS
          printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]' > "$SIGNING_DIR/expected-cert-sha256"
          chmod 600 "$SIGNING_DIR/signing.properties" "$SIGNING_DIR/expected-cert-sha256"
          echo "SKYMAP_SIGNING_PROPERTIES=$SIGNING_DIR/signing.properties" >> "$GITHUB_ENV"
          echo "SKYMAP_EXPECTED_CERT_SHA256=$SIGNING_DIR/expected-cert-sha256" >> "$GITHUB_ENV"
          echo "SKYMAP_SIGNING_MODE=production" >> "$GITHUB_ENV"

      - name: Build Android release APK
        id: gradle_build
        continue-on-error: true
        run: ./gradlew :android-app:assembleRelease --stacktrace --no-daemon --console=plain > /tmp/skymap-gradle.log 2>&1

      - name: Upload Gradle diagnostic
        if: steps.gradle_build.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SkyMap-Gradle-Diagnostic
          path: /tmp/skymap-gradle.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after concise Gradle failure
        if: steps.gradle_build.outcome == 'failure'
        run: |
          tail -n 180 /tmp/skymap-gradle.log
          exit 1

      - name: Verify release APK, signer and packaged experience
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/android-app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='${SKYMAP_VERSION_CODE}'" /tmp/badging.txt
          grep -q "versionName='${SKYMAP_VERSION}'" /tmp/badging.txt
          if grep -q '^application-debuggable' /tmp/badging.txt; then
            echo 'Release APK is debuggable' >&2
            exit 1
          fi

          ACTUAL_CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' /tmp/apksigner.txt | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT_SHA256"
          if [ "$SKYMAP_SIGNING_MODE" = 'production' ]; then
            test "$ACTUAL_CERT_SHA256" = "$(cat "$SKYMAP_EXPECTED_CERT_SHA256")"
          else
            grep -q 'SkyMap Ontario Pull Request' /tmp/apksigner.txt
          fi

          rm -rf /tmp/apk-inspect && mkdir /tmp/apk-inspect
          unzip -q "$APK" -d /tmp/apk-inspect
          grep -q 'WEATHER SNAPSHOTS' /tmp/apk-inspect/assets/index.html
          grep -q '7-DAY FORECAST' /tmp/apk-inspect/assets/index.html
          grep -q 'id="alert-banner"' /tmp/apk-inspect/assets/index.html
          grep -q 'id="map-legend"' /tmp/apk-inspect/assets/index.html
          grep -q 'Content-Security-Policy' /tmp/apk-inspect/assets/index.html
          grep -q 'renderAlerts' /tmp/apk-inspect/assets/app.js
          grep -q 'aqhi-observations-realtime' /tmp/apk-inspect/assets/app.js
          grep -q 'dark_only_labels' /tmp/apk-inspect/assets/app.js
          grep -q 'Promise.allSettled' /tmp/apk-inspect/assets/app.js
          grep -q 'NATIVE_GEOMET' /tmp/apk-inspect/assets/app.js
          grep -q 'NativeBridge' /tmp/apk-inspect/assets/app.js
          grep -q "${SKYMAP_VERSION}" /tmp/apk-inspect/assets/version.json
          strings /tmp/apk-inspect/classes*.dex > /tmp/classes.txt
          grep -q 'geomet-proxy' /tmp/classes.txt
          grep -q 'SkyMapNative' /tmp/classes.txt

      - name: Prepare lean website and release files
        run: |
          mkdir -p release _site/assets _site/app _site/download
          APK=android/app/build/outputs/apk/release/android-app-release.apk
          cp "$APK" "release/${SKYMAP_APK}"
          (cd release && sha256sum "${SKYMAP_APK}" > "${SKYMAP_APK}.sha256")
          cp "release/${SKYMAP_APK}" release/SkyMap-Ontario-latest.apk
          cp "release/${SKYMAP_APK}.sha256" release/SkyMap-Ontario-latest.apk.sha256
          cp index.html privacy.html version.json _site/
          cp assets/site.css assets/site.js _site/assets/
          cp -a app/. _site/app/
          cp "release/${SKYMAP_APK}" "release/${SKYMAP_APK}.sha256" release/SkyMap-Ontario-latest.apk release/SkyMap-Ontario-latest.apk.sha256 _site/download/
          node - <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('version.json'));
          fs.writeFileSync('_site/release.json', JSON.stringify({ ...version, commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, completedAt: new Date().toISOString() }, null, 2));
          NODE
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/app/app.js
          test -f "_site/download/${SKYMAP_APK}"
          test ! -f _site/.build/skymap13/chunk-00

      - name: Upload production release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SkyMap-Ontario-${{ env.SKYMAP_VERSION }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload production Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy SkyMap Ontario
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
