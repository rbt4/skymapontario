name: Materialize exact SkyMap 14.2.0

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/14.2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/14.2.0
          fetch-depth: 0

      - name: Reconstruct and verify supplied bundle
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/deploy-pages.yml /tmp/materializer.yml
          cat .release-upload/part-* | base64 --decode > /tmp/skymap-14.2.0.zip
          echo 'ac677237d17aadfa108887a999a5e6367063ca9f79e43243bbd540723ee1a18d  /tmp/skymap-14.2.0.zip' | sha256sum -c -
          unzip -oq /tmp/skymap-14.2.0.zip -d .
          sha256sum -c .release-upload/SHA256SUMS

      - name: Run required release validation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs
          node scripts/validate-release.mjs
          node --check app/app.js
          node --check app/sw.js
          node --check assets/site.js
          sha256sum -c .release-upload/SHA256SUMS

      - name: Commit verified non-workflow release files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/materializer.yml .github/workflows/deploy-pages.yml
          rm -rf .release-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SkyMap 14.2.0 — Plain Sight'
          git push origin HEAD:release/14.2.0
