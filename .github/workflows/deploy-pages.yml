name: Materialize SkyMap 14.2.1 Continuity

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/14.2.1-security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/14.2.1-security
          fetch-depth: 0

      - name: Reconstruct exact Continuity bundle
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/deploy-pages.yml /tmp/materializer.yml
          cat .release-continuity-upload/part-* | base64 --decode > /tmp/skymap-14.2.1-continuity.zip
          echo 'd54b61865cc870688b968c8d139334db3be83ea779de8139838c7b3f480f7598  /tmp/skymap-14.2.1-continuity.zip' | sha256sum -c -
          test "$(unzip -Z1 /tmp/skymap-14.2.1-continuity.zip | grep -v '/$' | wc -l | tr -d ' ')" = '17'
          unzip -oq /tmp/skymap-14.2.1-continuity.zip -d .
          rm -f scripts/configure-release-signing.sh

      - name: Validate public APK continuity contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs
          node scripts/validate-release.mjs
          node --check app/app.js
          node --check app/sw.js
          node --check assets/site.js
          echo '70fc1f50ba731049dbd623f61fbe31449838dbfa16a362c26e9b62c0d2b4c0e2  android/app/signing/skymap-public-release.jks' | sha256sum -c -

      - name: Commit verified non-workflow release files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/materializer.yml .github/workflows/deploy-pages.yml
          rm -rf .release-continuity-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SkyMap 14.2.1 — Continuity'
          git push origin HEAD:release/14.2.1-security
