name: Validate SkyMap forecast engine

on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/check-weathernext.mjs'
      - 'scripts/check-forecast-contract.mjs'
      - 'scripts/check-evidence-router.mjs'
      - 'scripts/check-progressive-fast-path.mjs'
      - 'scripts/check-forecast-court.mjs'
      - '.github/workflows/forecast-engine.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/check-weathernext.mjs'
      - 'scripts/check-forecast-contract.mjs'
      - 'scripts/check-evidence-router.mjs'
      - 'scripts/check-progressive-fast-path.mjs'
      - 'scripts/check-forecast-court.mjs'
      - '.github/workflows/forecast-engine.yml'

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check forecast engine JavaScript and data hierarchy
        run: |
          node --check app/accuracy-engine.js
          node --check app/forecast-intelligence-25.js
          node --check app/evidence-router.js
          node --check app/app.js
          node --check app/visit.js
          node --check app/conditions.js
          node --check app/native.js
          node scripts/check-visit-window.mjs
          node --check scripts/check-weathernext.mjs
          node --check scripts/check-forecast-contract.mjs
          node --check scripts/check-evidence-router.mjs
          node --check scripts/check-progressive-fast-path.mjs
          node --check scripts/check-forecast-court.mjs
          node scripts/check-forecast-contract.mjs
          node scripts/check-evidence-router.mjs
          node scripts/check-progressive-fast-path.mjs
          node scripts/check-forecast-court.mjs
          grep -q '<script src="accuracy-engine.js"></script>' app/index.html
          grep -q 'forecast-intelligence-25.js' app/index.html
          grep -q 'ensemble-api.open-meteo.com' app/index.html
          grep -q 'https://api.weather.gc.ca' app/index.html
          grep -q "VERSION = '34.0.0'" app/accuracy-engine.js
          grep -q "VERSION = '25.0.0'" app/forecast-intelligence-25.js
          grep -q 'google_weathernext2_ensemble' app/forecast-intelligence-25.js
          grep -q '__skymap_missing__' app/forecast-intelligence-25.js
          grep -q 'x-skymap-null-guard' app/forecast-intelligence-25.js
          grep -q 'Radar_1km_RainPrecipRate-Extrapolation' app/accuracy-engine.js
          grep -q 'REPS.DIAG.3_PRMM.ERGE1' app/accuracy-engine.js
          grep -q 'citypageweather-realtime' app/accuracy-engine.js
          grep -q 'neighbourhoodCoordinates' app/accuracy-engine.js
          grep -q 'leadBucket' app/accuracy-engine.js
          grep -q 'row.snow' app/accuracy-engine.js
          grep -q 'truth_contract' app/accuracy-engine.js
          grep -q 'hasExplicitForecastEvidence' app/accuracy-engine.js
          grep -q '<script src="evidence-router.js"></script>' app/index.html
          grep -q 'governed-single-pass' app/evidence-router.js
          grep -q 'model_rows_mutated: 0' app/accuracy-engine.js
      - name: Live Google WeatherNext 2 ensemble smoke test
        if: github.event_name == 'pull_request'
        run: node scripts/check-weathernext.mjs
